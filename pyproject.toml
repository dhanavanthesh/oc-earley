# Portions derived from dottxt-ai/outlines-core and modified by OC-Earley contributors.
# See PROVENANCE.md, NOTICE, and LICENSE.

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "oc-earley"
authors= [{name = "OC-Earley Developers"}]
description = "Exact JSON Schema constrained decoding in Rust and Python"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "PROVENANCE.md"]
keywords=[
    "machine learning",
    "deep learning",
    "language models",
    "structured generation",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

[project.optional-dependencies]
test-without-numba = [
    "pre-commit",
    "pydantic",
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-mock",
    "coverage[toml]>=5.1",
    "diff-cover",
    "numpy",
    "torch",
    "scipy",
    "asv",
    "psutil",
    "maturin[patchelf]",
]

test = [
    "oc-earley[test-without-numba]",
    "numba",
]

[project.urls]
homepage = "https://github.com/dhanavanthesh/oc-earley"
repository = "https://github.com/dhanavanthesh/oc-earley"

[project.readme]
file="README.md"
content-type = "text/markdown"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
addopts = [
    "--import-mode=importlib"
]
# provided by pytest-run-parallel but added here because
# pytest-run-parallel isn't a required test dependency
markers = [
    "thread_unsafe: Mark a test as thread-unsafe under pytest-run-parallel",
]

ignore_missing_imports = true

[tool.coverage.run]
omit = [
    "tests/*",
]
branch = true
relative_files = true

[tool.coverage.report]
omit = [
    "tests/*",
]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
show_missing = true

[tool.diff_cover]
compare_branch = "origin/main"
diff_range_notation = ".."

[tool.maturin]
features = ["python-bindings"]
module-name = "oc_earley.oc_earley"
python-source = "."
