name: Publish packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish to PyPI
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - id: version
        shell: python
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          import os
          import pathlib
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          version = manifest["package"]["version"]
          if version == "0.0.0":
              raise SystemExit("Cargo.toml still contains the placeholder version")
          tag = f"v{version}"
          if os.environ["RELEASE_TAG"] != tag:
              raise SystemExit(f"Release tag must be {tag}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --no-default-features
      - run: cargo test --all-features
      - run: cargo package --locked

  wheels:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: windows-latest
            target: x64
            manylinux: "off"
          - os: macos-14
            target: aarch64
            manylinux: "off"
          - os: macos-15-intel
            target: x86_64
            manylinux: "off"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.8"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --features python-bindings
          manylinux: ${{ matrix.manylinux }}
      - run: python -m pip install --force-reinstall --no-index --find-links dist oc-earley
      - name: Verify installed wheel
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tests/wheel_smoke.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  crates_io:
    name: crates.io
    needs: [verify, wheels, sdist]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/oc-earley
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  pypi:
    needs: [verify, wheels, sdist, crates_io]
    if: ${{ always() && needs.verify.result == 'success' && needs.wheels.result == 'success' && needs.sdist.result == 'success' && (needs.crates_io.result == 'success' || needs.crates_io.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/oc-earley/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
