# Portions derived from dottxt-ai/outlines-core and modified by OC-Earley contributors.
# See PROVENANCE.md, NOTICE, and LICENSE.

[package]
name = "oc-earley"
version = "0.1.0"
edition = "2021"
description = "Exact JSON Schema compilation for constrained decoding"
license = "Apache-2.0"
repository = "https://github.com/dhanavanthesh/oc-earley"
rust-version = "1.85.0"
keywords = ["json-schema", "constrained-decoding", "earley", "lalr"]
categories = ["parsing", "text-processing"]
include = [
    "/src/**",
    "/oc_earley/__init__.py",
    "/oc_earley/_json_schema.py",
    "/oc_earley/kernels/*.py",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/NOTICE",
    "/PROVENANCE.md",
    "/README.md",
    "/pyproject.toml",
]

[dependencies]
once_cell = "1.20"
thiserror = "2.0"
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
regex = "1.10.6"
serde-pyobject = { version = "0.8.0", optional = true }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
serde = {version = "1.0", features = ["derive"]}
bincode = "2.0.1"
rustc-hash = "2.1.0"
regex-automata = "0.4.9"

# Below are fragile dependencies, even minor updates of which often break the code
[dependencies.hf-hub]
version = "=0.4.1"
features = ["ureq", "rustls-tls"]
default-features = false
optional = true

[dependencies.tokenizers]
version = "0.22.2"
features = ["onig"]
default-features = false

[features]
default = ["hugginface-hub"]
python-bindings = ["pyo3", "pyo3/generate-import-lib", "serde-pyobject"]
hugginface-hub = ["hf-hub", "tokenizers/http",  "tokenizers/rustls-tls"]

[lib]
name = "oc_earley"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = 'abort'

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[[bin]]
name = "convert-json-schema"
test = false
bench = false

[[bin]]
name = "oc-earley"
bench = false
